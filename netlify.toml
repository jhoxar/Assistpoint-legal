# Netlify configuration — AssistPoint Clinical
#
# The site is Next.js 16 App Router with `output: 'export'`: eight content
# routes, no server work. The contact form posts to Netlify Forms, which reads
# the form out of the exported HTML, so there is nothing here that needs the
# Next.js Runtime — no @netlify/plugin-nextjs, no functions.
#
# No secrets live in this file. KIE_API_KEY is only used by the local asset
# generation scripts and must never be added to the Netlify environment.

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

# The hero plates and the webp stills are content-addressed by name and never
# change in place; a new asset gets a new deploy.
[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ONE block for "/*", deliberately. Netlify applies a single [[headers]] entry
# per pattern: split these across two "/*" blocks and the second is silently
# dropped at build time with no warning.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
